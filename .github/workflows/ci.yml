# The checks that must pass before anything is merged.
#
# There was no workflow before this: the tests were run by hand, and the
# bundle budget that Phase 1 introduced would have been a number nobody
# looked at again. A budget enforced on a developer's goodwill is not
# enforced.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # `npm ci` rather than `npm install`: it installs what the lockfile
      # says, so CI cannot pass against dependencies the repository does not
      # have pinned.
      - run: npm ci
      - run: npm test

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      # Fails if the first load crosses its budget, or if a library that is
      # meant to load on demand has found its way back into it.
      - run: npm run check:bundle

<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>طلب تجربة 7 أيام — HSE Training Dashboard</title>
  <style>
    :root { color-scheme: light dark; --bg:#f6f7f9; --card:#fff; --fg:#14171f; --muted:#5b6270; --line:#d5d9e0; --accent:#3b5bdb; --bad:#c92a2a; --ok:#2b8a3e; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0e1116; --card:#161b23; --fg:#e8ecf2; --muted:#9aa3b2; --line:#2b313c; --accent:#748ffc; --bad:#ff8787; --ok:#69db7c; } }
    :root[data-theme="dark"] { --bg:#0e1116; --card:#161b23; --fg:#e8ecf2; --muted:#9aa3b2; --line:#2b313c; --accent:#748ffc; --bad:#ff8787; --ok:#69db7c; }
    body { margin:0; background:var(--bg); color:var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; line-height:1.6; }
    main { max-width: 560px; margin: 0 auto; padding: 32px 16px 56px; }
    .top { display:flex; justify-content:space-between; align-items:center; gap:12px; }
    h1 { font-size: 1.5rem; margin: 8px 0 6px; }
    p.lede { color: var(--muted); margin: 0 0 20px; }
    form { background: var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; display:grid; gap:14px; }
    label { display:grid; gap:6px; font-weight:600; font-size:.95rem; }
    input, select { font: inherit; color: var(--fg); background: var(--bg); border:1px solid var(--line); border-radius:8px; padding:9px 10px; }
    fieldset { border:1px solid var(--line); border-radius:8px; padding:10px 12px; display:grid; gap:6px; }
    fieldset legend { font-weight:600; font-size:.95rem; padding:0 4px; }
    .check { display:flex; gap:8px; align-items:center; font-weight:400; }
    .hp { position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }
    button { font: inherit; font-weight:600; color:#fff; background: var(--accent); border:0; border-radius:8px; padding:11px 16px; cursor:pointer; }
    button:disabled { opacity:.55; cursor:default; }
    button.ghost { background:transparent; color: var(--accent); border:1px solid var(--line); }
    .msg { margin:0; font-size:.95rem; }
    .msg.bad { color: var(--bad); }
    .msg.ok { color: var(--ok); }
    .hint { color: var(--muted); font-size:.85rem; margin:0; }
    .hidden { display:none; }
    a.wa { display:inline-block; margin-top:8px; text-decoration:none; color:#fff; background:#1f8f4e; padding:10px 14px; border-radius:8px; font-weight:600; }
    footer { margin-top:24px; color:var(--muted); font-size:.85rem; }
  </style>
</head>
<body>
<main>
  <div class="top">
    <strong>HSE Training Dashboard</strong>
    <button class="ghost" type="button" id="lang-toggle">English</button>
  </div>
  <h1 data-t="title">طلب تجربة 7 أيام</h1>
  <p class="lede" data-t="lede">أرسل بياناتك وسنوافيك ببيانات الدخول. لا نطلب بطاقة ائتمان.</p>

  <form id="trial-form" novalidate>
    <label>
      <span data-t="company">اسم الشركة</span>
      <input name="companyName" required maxlength="120" autocomplete="organization" />
    </label>
    <label>
      <span data-t="email">البريد العملي</span>
      <input name="workEmail" type="email" required maxlength="254" autocomplete="email" />
      <span class="hint hidden" id="mail-warning" data-t="freeMail">بريد عام (جيميل أو غيره). يمكن المتابعة، لكن بريد الشركة أسرع للتحقق.</span>
    </label>
    <label>
      <span data-t="country">الدولة (اختياري)</span>
      <input name="country" maxlength="60" autocomplete="country-name" />
    </label>
    <label>
      <span data-t="headcount">عدد الموظفين في النطاق (تقريبي، اختياري)</span>
      <input name="headcountEstimate" type="number" min="1" max="100000" step="1" inputmode="numeric" />
    </label>
    <label>
      <span data-t="format">صيغة ملف التدريب (اختياري)</span>
      <select name="fileFormat">
        <option value="" data-t="formatNone">—</option>
        <option value="CSV">CSV</option>
        <option value="XLSX">XLSX</option>
      </select>
    </label>
    <fieldset>
      <legend data-t="interest">أهم ما يهمك (اختياري)</legend>
      <label class="check"><input type="checkbox" name="interest" value="reminders" /> <span data-t="i_reminders">التذكيرات</span></label>
      <label class="check"><input type="checkbox" name="interest" value="reports" /> <span data-t="i_reports">التقارير للمراجعات</span></label>
      <label class="check"><input type="checkbox" name="interest" value="arabic" /> <span data-t="i_arabic">دعم العربية</span></label>
      <label class="check"><input type="checkbox" name="interest" value="pricing" /> <span data-t="i_pricing">السعر</span></label>
    </fieldset>

    <div class="hp" aria-hidden="true">
      <label>Website <input name="website" tabindex="-1" autocomplete="off" /></label>
    </div>

    <button type="submit" id="submit" data-t="submit">أرسل الطلب</button>
    <p class="msg" id="status" role="status" aria-live="polite"></p>
    <div id="done" class="hidden">
      <p class="msg ok" data-t="received">استلمنا طلبك، وسنوافيك ببيانات الدخول خلال يوم عمل واحد.</p>
      <a class="wa hidden" id="wa" target="_blank" rel="noopener" data-t="wa">تابع عبر واتساب</a>
    </div>
  </form>

  <footer data-t="footer">الطلب يُرسل إلى قاعدة بيانات التجربة فقط. لا نطلب أسماء موظفين أو أرقام هوية.</footer>
</main>
<script type="module" src="/src/trial/main.js"></script>
</body>
</html>
